version: '3.8'

services:
  kifayat-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kifayat_ai_gateway
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite database and runtime data across container restarts
      - kifayat_data:/app/backend
    environment:
      - ENVIRONMENT=production
      - LLM_PROVIDER=nvidia
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  kifayat_data:
    driver: local
