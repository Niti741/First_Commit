# ==============================================================================
# KIFAYAT AI — NGINX PRODUCTION REVERSE PROXY CONFIGURATION
# Location on EC2: /etc/nginx/sites-available/kifayat
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain (e.g. ai.yourdomain.com) or leave as _ for Elastic IP

    # Maximum file upload size (PDFs, docs, code snippets)
    client_max_body_size 50M;

    # Gzip Compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # HTTP 1.1 protocol required for keepalive & streaming
        proxy_http_version 1.1;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======================================================================
        # CRITICAL SETTINGS FOR SERVER-SENT EVENTS (SSE) TOKEN STREAMING
        # Without these, Nginx buffers tokens and destroys real-time streaming!
        # ======================================================================
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';

        # WebSocket support (if enabled)
        proxy_set_header Upgrade $http_upgrade;
        
        # Extended timeouts for LLM thinking and long generational outputs
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
